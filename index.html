<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174ea6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="打卡計算器"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png"><title>打卡時間計算器</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#17243c;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif}.wrap{max-width:520px;margin:auto;padding:24px 18px 48px}h1{font-size:26px;margin:10px 0}p{color:#64748b;line-height:1.6}.panel{background:white;border-radius:20px;padding:20px;box-shadow:0 5px 25px #18315312;margin:18px 0}label{display:block;font-weight:700;margin-bottom:10px}input{width:100%;padding:14px;border:2px solid #bcd1f5;border-radius:12px;font-size:25px;color:#174ea6;background:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{border-radius:14px;padding:15px;background:#f0f5ff}.result small{display:block;color:#566782;font-size:13px;margin-bottom:5px}.result strong{font-size:25px;font-variant-numeric:tabular-nums}.result:first-child{background:#dbeafe}.result:last-child{background:#eaf8f0}.note{font-size:13px}button{border:0;border-radius:10px;background:#174ea6;color:white;padding:12px 16px;font-size:15px;cursor:pointer}footer{font-size:12px;color:#64748b;text-align:center;margin-top:22px}</style></head><body><main class="wrap"><h1>⏰ 打卡時間計算器</h1><p>輸入上班打卡時間，自動計算各種下班時間。支援離線使用。</p><section class="panel"><label for="clock">上班打卡時間</label><input id="clock" type="time" value="08:27"><p class="note">依原始試算表公式計算，並非通用勞動法規判定。</p></section><section class="panel"><div class="grid" id="results"></div></section><button id="copy">複製全部結果</button><footer>資料僅儲存在此裝置，不會上傳伺服器。</footer></main><script>const items=[['正常下班',540],['加班 1 小時',630],['加班 1.5 小時',660],['加班 2 小時',690],['加班 2.5 小時',720],['加班 3 小時',750],['加班 3.5 小時',780],['加班 4 小時',810],['上半天班',240]];const input=document.getElementById('clock'),results=document.getElementById('results');try{input.value=localStorage.getItem('clockTime')||'08:27'}catch(e){}function format(add){const [h,m]=input.value.split(':').map(Number);if(!Number.isFinite(h)||!Number.isFinite(m))return '--:--';let t=h*60+m+add;return `${String(Math.floor(t/60)%24).padStart(2,'0')}:${String(t%60).padStart(2,'0')}${t>=1440?'（隔日）':''}`}function render(){results.innerHTML='';for(const [label,minutes] of items){const div=document.createElement('div');div.className='result';const small=document.createElement('small');small.textContent=label;const strong=document.createElement('strong');strong.textContent=format(minutes);div.append(small,strong);results.append(div)}try{localStorage.setItem('clockTime',input.value)}catch(e){}}input.addEventListener('input',render);render();document.getElementById('copy').onclick=async()=>{const str=`上班時間 ${input.value}\n`+items.map(([n,m])=>`${n}：${format(m)}`).join('\n');try{await navigator.clipboard.writeText(str);alert('已複製結果')}catch(e){prompt('請複製以下結果',str)}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
