<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174ea6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="打卡計算器"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png"><title>打卡時間計算器</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#17243c;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif}.wrap{max-width:520px;margin:auto;padding:24px 18px 48px}h1{font-size:26px;margin:10px 0}p{color:#64748b;line-height:1.6}.panel{background:white;border-radius:20px;padding:20px;box-shadow:0 5px 25px #18315312;margin:18px 0}label{display:block;font-weight:700;margin-bottom:10px}input{width:100%;padding:14px;border:2px solid #bcd1f5;border-radius:12px;font-size:25px;color:#174ea6;background:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{border-radius:14px;padding:15px;background:#f0f5ff}.result small{display:block;color:#566782;font-size:13px;margin-bottom:5px}.result strong{font-size:25px;font-variant-numeric:tabular-nums}.result:first-child{background:#dbeafe}.result:last-child{background:#eaf8f0}.note{font-size:13px}button{border:0;border-radius:10px;background:#174ea6;color:white;padding:12px 16px;font-size:15px;cursor:pointer}footer{font-size:12px;color:#64748b;text-align:center;margin-top:22px}select{width:100%;padding:12px;font-size:16px;border:1px solid #bcd1f5;border-radius:10px;background:white} .field{margin:14px 0}.warn{color:#9a3412;background:#fff7ed;padding:12px;border-radius:10px}.summary{font-size:16px;line-height:1.7} .result strong{font-size:23px}</style></head><body><main class="wrap"><h1>打卡與請假計算器</h1><p>V6.0 · 中午到班與半天假自動計算</p><section class="panel"><label for="clock">實際上班時間</label><input id="clock" type="time" value="08:27"><div class="field"><label for="kind">請假類型</label><select id="kind"></select><p id="limit" class="note"></p><div id="alternatives" class="note"></div></div><div id="mid" class="field"></div><details><summary>手動指定原定上班時間（選填）</summary><input id="base" type="time" min="07:00" max="09:00"><button id="clear">恢復自動</button></details><p class="note">12:00～14:00 到班優先建議上午請假 4 小時；13:00 預設依指定案例採 09:00 班別，也可切換 08:00 班別。其他時間優先最少請假，再優先銜接打卡。午休不計請假。若已申請假單，請指定原定班別。</p></section><section class="panel" id="out" aria-live="polite"></section><section class="panel" id="half"></section><section class="panel" id="ot"></section><button id="copy">複製結果</button><footer>本機運算 · 09:30 後停用遲到用特休。請假與加班仍須依公司核准。</footer></main><script>
const $=x=>document.getElementById(x);const parse=s=>/^\d{2}:\d{2}$/.test(s)?Number(s.slice(0,2))*60+Number(s.slice(3)):NaN;const fmt=n=>String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0')+(n>=1440?'（隔日）':'');const range=(a,b)=>fmt(a)+'～'+fmt(b);const work=(s,a)=>Math.max(0,Math.min(240,a-s))+Math.max(0,Math.min(240,a-s-300));
function plan(a,s,u){if(s<420||s>540||a<s||a>=s+540)return null;const gap=work(s,a),leave=Math.ceil(gap/u)*u;if(leave>=480)return null;const spans=[];if(leave>0)spans.push(range(s,s+Math.min(leave,240)));if(leave>240)spans.push(range(s+300,s+300+leave-240));return {s,gap,leave,spans,end:s+540,resume:leave<240?s+leave:leave===240?s+300:s+300+leave-240};}
const TYPES=[{id:'late',name:'特休（遲到用）',unit:30},{id:'annual',name:'特休（一般）',unit:120},{id:'sick30',name:'病假（0.5H 單位）',unit:30},{id:'sick60',name:'病假（1H 單位）',unit:60},{id:'personal',name:'事假',unit:30}];
function choose(a,u,b){if(Number.isFinite(b))return plan(a,b,u);if(a<420)return null;if(a<=540)return plan(a,a,u);if(a>=720&&a<=840){const s=a===780?540:a-300;const r=plan(a,s,u);if(r&&r.leave===240)return r;}let best=null;for(let s=420;s<=540;s++){let r=plan(a,s,u);if(!r)continue;let score=Math.abs(r.resume-a),old=best?Math.abs(best.resume-a):Infinity;if(!best||r.leave<best.leave||(r.leave===best.leave&&score<old)||(r.leave===best.leave&&score===old&&r.s<best.s))best=r;}return best;}
function options(a,b){return TYPES.map(t=>({...t,r:choose(a,t.unit,b)})).filter(t=>t.r&&(t.id!=='late'||(a<=570&&t.r.leave<=30)));}
function row(k,v){return '<p style="margin:10px 0;color:#17243c">'+k+'：<strong>'+v+'</strong></p>'}function card(k,v){return '<div class="result"><small>'+k+'</small><strong>'+v+'</strong></div>'}let output='';function render(){let a=parse($('clock').value),b=parse($('base').value),prev=$('kind').value,opts=options(a,b);$('kind').innerHTML=opts.map(t=>'<option value="'+t.id+'">'+t.name+' — '+(t.r.leave/60)+' 小時</option>').join('');if(opts.some(t=>t.id===prev))$('kind').value=prev;let selected=opts.find(t=>t.id===$('kind').value),r=selected?.r;$('kind').disabled=!opts.length;$('mid').innerHTML=a>=720&&a<=840?'<div class="warn">上午半天假方案（4 小時）：<br>'+Array.from({length:121},(_,i)=>420+i).filter(s=>a>=s+240&&a<=s+300).filter(s=>s%30===0||s===a-300||s===a-240).map(s=>'<button type="button" style="margin:4px 0;width:100%;text-align:left" data-base="'+fmt(s)+'">'+range(s,s+240)+' 請假 · '+fmt(s+540)+' 下班'+(a<s+300?'（午休到 '+fmt(s+300)+'）':'')+'</button>').join('')+'</div>':'';$('limit').textContent=a>570?'已超過 09:30，遲到用特休不可選擇。':(a<=540?'彈性上班時間內，自動模式不需請假。':'09:30 前可使用遲到用特休 0.5 小時。');$('alternatives').innerHTML=opts.map(t=>'<div style="padding:6px 0">'+t.name+'：'+(t.r.leave? t.r.leave/60+'H · '+t.r.spans.join('、'):'不需請假')+' · 下班 '+fmt(t.r.end)+'</div>').join('');$('half').innerHTML='';$('ot').innerHTML='';output='';if(!r){$('out').textContent='無有效班別，請確認上班時間或原定班別；全天請假不適用。';return}let s=r.s;let warning=r.leave>r.gap?'請假進位後與實際打卡有重疊，須確認公司是否允許提早復工。':'';if(a>=s+240&&a<s+300)warning+=' 目前打卡落在午休，下午工作從 '+fmt(s+300)+' 開始。';$('out').innerHTML='<h2>計算結果</h2><div class="grid">'+card('建議請假',r.leave/60+' 小時')+card('正常下班',fmt(r.end))+'</div>'+row('選擇假別',r.leave?selected.name:'不需請假')+row('原定上班',fmt(s))+row('請假開始',r.leave?fmt(s):'—')+row('請假區間',r.spans.join('、')||'不需請假')+row('午休時間',range(s+240,s+300))+row('實際缺勤',r.gap+' 分鐘')+(warning?'<div class="warn">'+warning+'</div>':'');$('half').innerHTML='<h2>半天班參考（原定 '+fmt(s)+'）</h2>'+row('上半天班離開',fmt(s+240))+row('下午請假 4 小時',range(s+300,s+540))+row('上午請假 4 小時',range(s,s+240))+row('下半天班到公司',fmt(s+300))+row('下半天班下班',fmt(s+540))+'<p class="note">半天班為獨立參考，並非與上述上午請假疊加。</p>';$('ot').innerHTML='<h2>加班下班時間</h2><div class="grid">'+Array.from({length:7},(_,i)=>card('加班 '+(1+i/2)+' 小時',fmt(r.end+90+i*30))).join('')+'</div><p class="note">假設請假日允許加班，正常下班後休息 30 分鐘。</p>';output=$('out').innerText+'\n'+$('half').innerText+'\n'+$('ot').innerText;}
$('mid').addEventListener('click',e=>{const b=e.target.closest('button[data-base]');if(b){$('base').value=b.dataset.base;render()}});$('clock').addEventListener('input',()=>{$('base').value=''});for(let id of ['clock','kind','base'])$(id).addEventListener('input',render);$('clear').onclick=()=>{$('base').value='';render()};$('copy').onclick=async()=>{if(!output)return;try{await navigator.clipboard.writeText(output)}catch(e){prompt('複製結果',output)}};render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
